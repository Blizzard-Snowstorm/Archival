<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra Secret Video</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #121212;
      font-family: system-ui, -apple-system, sans-serif;
    }
    video {
      max-width: 90%;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .modal {
      background: #1e1e1e;
      color: #ffffff;
      padding: 24px 32px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      border: 1px solid #333;
    }
    button {
      margin-top: 16px;
      padding: 10px 28px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background-color: #0066cc;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0052a3;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <div class="modal">
      <p>Warning: Classified content ahead. Press OK to continue.</p>
      <button id="okBtn">OK</button>
    </div>
  </div>

  <video id="secretVideo" controls playsinline>
    <source src="https://raw.githubusercontent.com/Blizzard-Snowstorm/iLoveRickrolling/main/Ultra%20secret%20video.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <script>
    const overlay = document.getElementById("overlay");
    const okBtn = document.getElementById("okBtn");
    const video = document.getElementById("secretVideo");

    okBtn.addEventListener("click", () => {
      overlay.style.display = "none";
      video.play();
    });
  </script>

</body>
</html>
